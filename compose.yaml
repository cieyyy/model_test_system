name: model-test

x-runtime: &runtime
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "2"

services:
  app:
    <<: *runtime
    image: local/model-test:${MT_VERSION:-latest}
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-999}
        APP_GID: ${APP_GID:-988}
    env_file: /etc/model-test/platform.env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - /var/lib/model-test:/var/lib/model-test
      - /etc/model-test:/etc/model-test:ro
      - /var/lib/model-test/acceptance-fixtures:/app/test-scripts/standalone-acceptance/fixtures:ro
    ports:
      - 127.0.0.1:8032:8032
    stop_grace_period: 60s

  proxy:
    <<: *runtime
    image: nginx:1.28-alpine
    entrypoint: [/bin/sh, /opt/model-test/nginx-start.sh]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=16m
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./deploy/docker/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ${MT_NGINX_CONFIG:-./deploy/docker/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/docker/nginx-start.sh:/opt/model-test/nginx-start.sh:ro
      - /etc/model-test/htpasswd:/etc/model-test/htpasswd:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/model-test-acme:/var/www/model-test-acme:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  certbot:
    <<: *runtime
    image: certbot/certbot:v5.8.0
    depends_on:
      proxy:
        condition: service_healthy
    entrypoint: [/bin/sh, /opt/model-test/certbot-renew.sh]
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /var/log/letsencrypt:size=16m
      - /var/lib/letsencrypt:size=16m
    volumes:
      - ./deploy/docker/certbot-renew.sh:/opt/model-test/certbot-renew.sh:ro
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/model-test-acme:/var/www/model-test-acme
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.stat('/tmp/renew-ok').st_mtime < 25200"]
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 2m
      start_interval: 5s
