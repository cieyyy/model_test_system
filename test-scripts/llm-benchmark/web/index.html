<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>模型性能测试</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <aside id="sidebar">
    <div class="brand"><span class="brand-mark">M</span> 模型测试</div>
    <button id="new-run" class="primary">新建测试</button>
    <div class="history-heading">测试记录 <span id="history-count">0</span></div>
    <nav id="history" aria-label="测试记录"></nav>
    <div class="sidebar-footer">本地工作空间</div>
  </aside>
  <main>
    <details id="configuration" open>
      <summary>测试配置</summary>
      <form id="config-form">
        <div class="form-grid">
          <label>报告名称<input name="name" value="DeepSeek 性能测试" maxlength="150"></label>
          <label class="wide">接口地址 / Base URL<input name="endpoint" type="url" placeholder="https://api.example.com/v1"></label>
          <label>模型 ID<input name="model" placeholder="填写实际模型 ID"></label>
          <label class="wide">API Key<input name="api_key" type="password" autocomplete="off" placeholder="留空则使用 MODEL_TEST_API_KEY"></label>
          <label>并发数<input name="concurrency" type="number" min="1" max="500" value="50" required></label>
          <label>请求总数<input name="total_requests" type="number" min="1" max="100000" value="160" required></label>
          <label>单请求超时（秒）<input name="timeout_seconds" type="number" min="0.1" max="3600" step="0.1" value="60" required></label>
          <label>限制时长（秒，0 不限）<input name="duration_seconds" type="number" min="0" max="86400" value="0" required></label>
          <label>提示词模式<select name="prompt_mode"><option value="generated">自动生成</option><option value="custom">自定义提示词</option></select></label>
          <label>输入 Token 目标<input name="prompt_tokens" type="number" min="1" max="1000000" value="32000" required></label>
          <label>最大输出 Token<input name="max_tokens" type="number" min="1" max="1000000" value="256" required></label>
          <label>输出参数字段<select name="max_tokens_field"><option>max_tokens</option><option>max_completion_tokens</option></select></label>
          <label>Temperature<input name="temperature" type="number" min="0" max="2" step="0.1" placeholder="模型默认"></label>
          <label class="wide">HTTP 代理<input name="proxy" placeholder="留空直连"></label>
          <label class="check"><input name="include_usage" type="checkbox" checked> 请求流式 Usage</label>
          <label class="full" id="custom-prompt" hidden>提示词<textarea name="prompt" rows="4">请用中文解释缓存如何改善大语言模型的推理性能。</textarea></label>
        </div>
        <div class="form-actions"><button type="button" id="demo-run">运行模拟测试</button><button type="submit" class="primary" id="start-run">开始测试</button></div>
      </form>
    </details>
    <div id="message" role="alert" hidden></div>
    <article id="report" hidden>
      <header class="report-header"><div><h1 id="report-title">测试报告</h1><div id="report-subtitle" class="muted"></div></div><span id="demo-badge" hidden>模拟数据</span></header>
      <div class="run-toolbar">
        <div class="run-meta"><span id="status" class="status"></span><span id="run-meta"></span></div>
        <div class="export-actions"><button id="cancel-run" class="danger" hidden>取消测试</button><button id="export-pdf">导出 PDF</button><button id="export-csv">导出 CSV</button><button id="export-html">导出 HTML</button><button id="export-json">JSON</button></div>
      </div>
      <div class="progress-track" id="progress-track" hidden><div id="progress-bar"></div></div>
      <div id="report-error" class="error" hidden></div>
      <section class="metrics-grid" id="metrics" aria-label="测试指标"></section>
      <div class="analysis-grid">
        <section><h2>延迟百分位</h2><div class="table-frame"><table id="percentiles"><thead><tr><th>指标</th><th>Avg</th><th>P50</th><th>P90</th><th>P95</th></tr></thead><tbody></tbody></table></div></section>
        <section><h2>请求延迟分布</h2><div class="chart-wrap"><canvas id="latency-chart" role="img" aria-label="逐请求总延迟、TTFT 和 TPOT 曲线"></canvas><div id="chart-tooltip" hidden></div></div><div class="legend"><label style="--series:#0c9b71"><input type="checkbox" data-series="tpot_ms" checked> TPOT</label><label style="--series:#336cfb"><input type="checkbox" data-series="ttft_ms" checked> TTFT</label><label style="--series:#ea414a"><input type="checkbox" data-series="latency_ms" checked> 总延迟</label></div></section>
      </div>
      <section class="requests-section"><div class="section-heading"><h2>逐请求明细</h2><div class="request-controls"><label>状态<select id="status-filter"><option value="all">全部</option><option value="success">成功</option><option value="failed">失败</option><option value="cancelled">取消</option></select></label><span id="failure-count" class="muted"></span></div></div>
        <div class="table-frame requests-frame"><table id="requests"><thead><tr><th>#</th><th>状态</th><th>提示词 / 错误</th><th>总延迟</th><th>TTFT</th><th>TPOT</th><th>输入 / 输出 Token</th><th>缓存 Token</th><th>HTTP</th></tr></thead><tbody></tbody></table></div>
        <div class="pagination"><span id="row-count" class="muted"></span><div><button id="prev-page" title="上一页" aria-label="上一页">←</button><span id="page-label"></span><button id="next-page" title="下一页" aria-label="下一页">→</button></div></div>
      </section>
    </article>
    <div id="empty-state">尚无测试报告</div>
  </main>
</body>
</html>
