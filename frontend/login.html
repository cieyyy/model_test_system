<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 模型测试平台</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #080b10; color: #f1f3f5; }
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px; }
    main { width: 100%; max-width: 380px; }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 48px; color: #d4aa59; font-size: 15px; }
    .mark { display: grid; place-items: center; width: 38px; height: 38px; background: #f1f3f5; color: #080b10; font-weight: 750; font-size: 23px; }
    h1 { font-size: 26px; font-weight: 600; margin: 0 0 30px; }
    label { display: block; font-size: 14px; color: #b8c0cc; margin: 0 0 9px; }
    input { display: block; width: 100%; height: 46px; background: #11171f; color: #f1f3f5; border: 1px solid #303945; border-radius: 6px; padding: 0 13px; font: inherit; font-size: 16px; margin-bottom: 22px; outline: none; }
    input:focus { border-color: #d4aa59; box-shadow: 0 0 0 2px #d4aa5924; }
    button { width: 100%; min-height: 46px; border: 0; border-radius: 6px; background: #d4aa59; color: #17130c; font: inherit; font-size: 15px; font-weight: 650; cursor: pointer; }
    button:hover { background: #e1bc72; }
    button:focus-visible { outline: 2px solid #f1f3f5; outline-offset: 3px; }
    button:disabled { opacity: .65; cursor: wait; }
    #message { min-height: 44px; margin: 14px 0 0; color: #f29b9b; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">M</span><span>模型测试 · MODEL TESTING</span></div>
    <h1>登录工作空间</h1>
    <form id="loginForm">
      <label for="username">账号</label>
      <input id="username" name="username" autocomplete="username" maxlength="256" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
      <button type="submit" id="submitButton">登录</button>
      <p id="message" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.getElementById('submitButton');
      const message = document.getElementById('message');
      button.disabled = true;
      button.textContent = '正在登录…';
      message.textContent = '';
      try {
        const response = await fetch('/auth/login', {
          method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username: document.getElementById('username').value, password: document.getElementById('password').value})
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          message.textContent = response.status === 429 ? '登录尝试较多，请稍后重试' : (typeof data.detail === 'string' ? data.detail : '登录失败，请稍后重试');
          return;
        }
        const next = new URLSearchParams(location.search).get('next') || '/';
        const target = new URL(next, location.origin);
        location.replace(target.origin === location.origin ? target.pathname + target.search + (target.hash || location.hash) : '/');
      } catch {
        message.textContent = '连接失败，请检查网络后重试';
      } finally {
        button.disabled = false;
        button.textContent = '登录';
      }
    });
  </script>
</body>
</html>
