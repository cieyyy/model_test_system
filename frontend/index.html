<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模型测试平台 · 测试报告</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('platformTheme')==='light'?'light':'dark';}catch{document.documentElement.dataset.theme='dark';}</script>
<link rel="stylesheet" href="/static/suites.css?v=20261020-report-toggle">
<style>
  :root {
    --bg: #f5f5f2; --surface: #ffffff; --border: #e2e0d8; --border-strong: #c8c6bd;
    --text: #2c2c2a; --text-2: #5f5e5a; --text-3: #888780;
    --accent: #534ab7; --accent-bg: #eeedfe; --accent-border: #a0f;
    --ok: #0f6e56; --ok-bg: #e1f5ee; --warn: #854f0b; --warn-bg: #faeeda;
    --danger: #a32d2d; --danger-bg: #fcebeb; --blue: #185fa5; --blue-bg: #e6f1fb;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .phase { font-size: 12px; color: var(--accent); background: var(--accent-bg); padding: 2px 10px; border-radius: 99px; }
  header .pw-state { margin-left: auto; font-size: 12px; }
  header .pw-state .ok { color: var(--ok); } header .pw-state .no { color: var(--warn); }
  nav { display: flex; gap: 4px; padding: 10px 28px 0; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  nav button { border: none; background: none; padding: 8px 16px 10px; font-size: 14px; color: var(--text-2); cursor: pointer; border-bottom: 2px solid transparent; }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 28px 60px; }
  h2 { font-size: 15px; font-weight: 600; margin: 8px 0 14px; }
  .hint { color: var(--text-3); font-size: 12.5px; margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat .num { font-size: 26px; font-weight: 600; color: var(--accent); }
  .stat .label { font-size: 12px; color: var(--text-3); }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; font-size: 13px; }
  .tw { overflow-x: auto; }
  .tw table { min-width: 100%; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; white-space: nowrap; }
  th { background: #f1efe8; color: var(--text-2); font-weight: 500; font-size: 12.5px; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .tag { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--blue-bg); color: var(--blue); }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.gray { background: #f1efe8; color: var(--text-2); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.off { background: var(--danger-bg); color: var(--danger); }
  .btn { border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { opacity: .9; color: #fff; }
  .btn.small { padding: 3px 10px; font-size: 12px; border-radius: 6px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  form.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--text-2); }
  .field input, .field select, .field textarea { border: 1px solid var(--border-strong); border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit; min-width: 140px; background: #fff; }
  .field textarea { min-width: 320px; }
  .actions { display: inline-flex; gap: 2px; flex-wrap: nowrap; white-space: nowrap; vertical-align: middle; }
  .actions .btn.small { border: none; background: none; padding: 3px 7px; color: var(--accent); border-radius: 5px; }
  .actions .btn.small:hover { background: var(--accent-bg); border: none; color: var(--accent); }
  .actions .btn.small.danger { color: var(--danger); }
  .actions .btn.small.danger:hover { background: var(--danger-bg); color: var(--danger); }
  pre.fileview { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; max-height: 55vh; overflow: auto; font-size: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-all; }
  .empty { text-align: center; color: var(--text-3); padding: 30px 0; }
  .modal-mask { position: fixed; inset: 0; background: rgba(40,40,38,.4); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal-mask.show { display: flex; }
  .modal { background: var(--surface); border-radius: 12px; padding: 22px 24px; width: min(760px, 92vw); height: min(680px, 82vh); min-width: 320px; min-height: 180px; max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); resize: both; overflow: auto; }
  .modal.preview-modal { width: min(1200px, 94vw); height: min(820px, 92vh); display: flex; flex-direction: column; overflow: hidden; }
  .modal.preview-modal.is-max { width: calc(100vw - 24px); height: calc(100vh - 24px); }
  .preview-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 12px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
  .preview-toolbar label { font-size: 12px; color: var(--text-2); } .preview-toolbar input[type=range] { width: 150px; accent-color: var(--accent); }
  .preview-toolbar output { min-width: 42px; font: 12px/1.4 "SF Mono",Menlo,monospace; color: var(--accent); }
  .preview-content { flex: 1; min-height: 0; overflow: auto; } .preview-content iframe { display: block; width: 100%; height: 100%; min-height: 420px; border: 1px solid var(--border); background: #fff; }
  .preview-text { flex: 1; min-height: 0; max-height: none !important; }
  .modal h3 { font-size: 15px; margin-bottom: 12px; } .preview-modal h3 { flex: none; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .keybox { font-family: "SF Mono", Menlo, monospace; background: #f1efe8; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; word-break: break-all; font-size: 13px; margin: 10px 0; }
  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: #2c2c2a; color: #fff; padding: 9px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 99; }
  .toast.show { opacity: .95; }
  .code { font-family: "SF Mono", Menlo, monospace; font-size: 12px; color: var(--text-2); }
  .step { display: flex; gap: 10px; margin-bottom: 8px; }
  .step .n { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-bg); color: var(--accent); font-size: 12px; display: flex; align-items: center; justify-content: center; font-weight: 600; margin-top: 2px; }
  .checkline { display: flex; align-items: center; gap: 8px; }
  .checkline input[type=checkbox] { width: 15px; height: 15px; }
  .terminal { background: #1e1e1c; color: #d5d3c8; font-family: "SF Mono", Menlo, monospace; font-size: 12px; padding: 12px 14px; border-radius: 8px; max-height: 360px; overflow: auto; white-space: pre-wrap; line-height: 1.55; }
  .terminal .ok { color: #7bd8ab; } .terminal .err { color: #f09595; } .terminal .warn { color: #ef9f27; } .terminal .dim { color: #888780; }
  .term-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .term-head b { font-size: 13.5px; }
  .mono { font-family: "SF Mono", Menlo, monospace; font-size: 12px; background: #f1efe8; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto; }
  .ev-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .ev-tabs button { font-size: 12px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; }
  .ev-tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pass { color: var(--ok); font-weight: 500; } .fail { color: var(--danger); font-weight: 500; }
  @media (max-width: 760px) {
    header { padding: 10px 14px; flex-wrap: wrap; gap: 10px; }
    nav { padding: 8px 12px 0; }
    main { padding: 18px 12px 50px; }
    .field input, .field select, .field textarea { min-width: 120px; }
  }
</style>

</head>
<body>
<aside id="platformSidebar">
  <a class="workspace-brand" href="#dashboard" onclick="event.preventDefault();go('dashboard')"><span class="workspace-mark"><i data-lucide="aperture" aria-hidden="true"></i></span><span>模型测试<small>MODEL TESTING</small></span></a>
  <nav id="nav" aria-label="工作区导航"></nav>
  <div class="workspace-sidebar-footer"><i data-lucide="layers-2" aria-hidden="true"></i> 测试工作空间 <span>01</span></div>
</aside>
<div id="platformWorkspace">
<header>
  <div class="studio-breadcrumb"><span>工作空间</span><i data-lucide="chevron-right" aria-hidden="true"></i><h1 id="workspaceLocation">数据展示</h1></div>
  <span class="phase">模型测试 · 测试报告</span>
  <div class="studio-header-actions"><span class="pw-state" id="pwState"></span><button class="studio-icon-button" id="themeToggle" type="button" onclick="studioToggleTheme()" title="切换到浅色" aria-label="切换到浅色"><i data-lucide="sun" aria-hidden="true"></i></button><button class="studio-icon-button" type="button" onclick="go('settings')" title="设置" aria-label="设置"><i data-lucide="settings-2" aria-hidden="true"></i></button></div>
</header>
<main id="workspaceMain"><nav id="workspaceSectionNav" aria-label="页面功能"></nav><div id="main"></div></main>
</div>

<div class="modal-mask" id="mask"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="/static/vendor/lucide.min.js"></script>
<script src="/static/studio.js?v=20261022-four-sections"></script>
<script src="/static/suites.js?v=20261020-report-toggle"></script>
<script src="/static/reports.js?v=20261020-report-grouping"></script>
<script src="/static/workspace.js?v=20261016-reports"></script>
<script>
const API = "/api";
let state = { tab: location.hash.slice(1) || "dashboard", providers: [], models: [], projects: [], stats: {}, legacyRoot: "" };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg, ms = 2200) {
  $("#toast").textContent = msg; $("#toast").classList.add("show");
  setTimeout(() => $("#toast").classList.remove("show"), ms);
}
async function api(path, opts = {}) {
  const res = await fetch(API + path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || res.statusText); }
  return res.json();
}
function openModal(html) { const box = $("#modalBox"); box.classList.remove("preview-modal", "is-max"); box.innerHTML = html; $("#mask").classList.add("show"); }
function closeModal() { $("#mask").classList.remove("show"); }
$("#mask").addEventListener("click", (e) => { if (e.target.id === "mask") closeModal(); });

const TABS = [
  ["suites", "新建测试"],
  ["dashboard", "数据展示"],
  ["history", "测试记录"],
  ["matrix", "模型对比"],
];
const SECTION_VIEWS = {
  suites: [['suites', '测试配置'], ['exec', '脚本执行'], ['providers', '中转站与密钥'], ['models', '模型管理'], ['projects', '测试项目'], ['settings', '平台设置']],
  dashboard: [['dashboard', '指标曲线'], ['overview', '统计总览']],
  history: [['history', '运行记录'], ['reports', '测试报告']],
  matrix: [['matrix', '对比结果'], ['import', '导入测试记录']],
};

function renderNav() {
  const section = Object.keys(SECTION_VIEWS).find(key => SECTION_VIEWS[key].some(([view]) => view === state.tab)) || 'dashboard';
  const icons={suites:'plus',dashboard:'activity',history:'history',matrix:'grid-2x2'};
  $('#nav').innerHTML = TABS.map(([key,label]) => `<button type="button" data-section="${key}" class="${section===key?'active':''}" onclick="go('${key}')" ${section===key?'aria-current="page"':''}><i data-lucide="${icons[key]}" aria-hidden="true"></i><span>${label}</span></button>`).join('');
  const sectionLabel=TABS.find(([key])=>key===section)[1];
  $('#workspaceLocation').textContent=sectionLabel;
  $('#workspaceSectionNav').setAttribute('aria-label',sectionLabel+'功能');
  $('#workspaceSectionNav').innerHTML=SECTION_VIEWS[section].map(([view,label])=>`<button type="button" class="${view===state.tab?'active':''}" ${view===state.tab?'aria-current="page"':''} onclick="go('${view}')">${label}</button>`).join('');
}
function go(tab) {
  clearTimeout(workspacePoll);clearTimeout(suitePoll);
  workspaceGeneration++;suiteGeneration++;
  if(state.tab==='suites' && $('#suiteForm')) suiteRemember();
  state.tab=Object.values(SECTION_VIEWS).flat().some(([view])=>view===tab)?tab:'dashboard';
  history.replaceState(null,'','#'+state.tab);
  renderNav();
  return render().catch(e=>toast(e.message));
}
window.go = go;
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));

async function refreshData() {
  const [providers, models, projects, stats] = await Promise.all([
    api("/providers"), api("/models"), api("/projects"), api("/stats"),
  ]);
  Object.assign(state, { providers, models, projects, stats });
  $("#pwState").innerHTML = stats.password_set
    ? '<span class="ok">主密码已设置</span>' : '<span class="no">主密码未设置（查看 Key 前需设置）</span>';
}

async function render() {
  const tab=state.tab;
  await refreshData();
  if(state.tab!==tab) return;
  const R = { dashboard: renderDashboard, history: renderWorkspaceHistory, overview: renderOverview, providers: renderProviders, models: renderModels,
              projects: renderProjects, exec: renderExec, matrix: renderMatrix, import: renderImport, settings: renderSettings,
              suites: renderSuites, reports: renderSuiteReports };
  await (R[tab] || renderDashboard)();
}

/* ---------------- 总览 ---------------- */
function renderOverview() {
  const s = state.stats;
  $("#main").innerHTML = `
    <h2>统计总览</h2>
    <div class="grid">
      <div class="stat"><div class="num">${s.providers}</div><div class="label">中转站</div></div>
      <div class="stat"><div class="num">${s.models}</div><div class="label">模型</div></div>
      <div class="stat"><div class="num">${s.projects}</div><div class="label">测试项目</div></div>
      <div class="stat"><div class="num">${s.credentials}</div><div class="label">密钥（加密保存）</div></div>
      <div class="stat"><div class="num">${s.imported_assets}</div><div class="label">已登记资产文件</div></div>
      <div class="stat"><div class="num" style="color:var(--ok)">${s.runs_passed ?? 0}</div><div class="label">执行通过</div></div>
      <div class="stat"><div class="num" style="color:var(--danger)">${s.runs_failed ?? 0}</div><div class="label">执行失败</div></div>
    </div>
    <div class="suite-toolbar"><button class="btn" onclick="go('dashboard')">查看指标曲线</button><button class="btn" onclick="go('history')">查看测试记录</button><button class="btn" onclick="go('matrix')">模型对比</button></div>`;
}

/* ---------------- 中转站 ---------------- */
function renderProviders() {
  const rows = state.providers.map(p => `
    <tr>
      <td><b>${esc(p.name)}</b></td>
      <td class="code">${esc(p.base_url) || "—"}</td>
      <td><span class="tag">${esc(p.protocol)}</span></td>
      <td>${p.model_count}</td>
      <td>${p.credential_count ? p.key_hints.map(h => `<span class="tag gray">${esc(h)}</span>`).join(" ") : '<span style="color:var(--text-3)">无</span>'}</td>
      <td>${p.enabled ? '<span class="tag">启用</span>' : '<span class="tag off">停用</span>'}</td>
      <td class="actions">
        <button class="btn small" onclick="editProvider(${p.id})">编辑</button>
        <button class="btn small" onclick="manageKeys(${p.id})">密钥 ${p.credential_count}</button>
        <button class="btn small" onclick="toggleProvider(${p.id}, ${!p.enabled})">${p.enabled ? "停用" : "启用"}</button>
        <button class="btn small danger" onclick="delProvider(${p.id})">删除</button>
      </td>
    </tr>`).join("");
  $("#main").innerHTML = `
    <h2>中转站</h2>
    <div class="hint">登记中转站网站、协议与 API Key。Key 加密保存、默认只显示掩码，查看明文需平台主密码验证。</div>
    <div class="card">
      <form class="row" onsubmit="return createProvider(event)">
        <div class="field"><label>名称 *</label><input id="p_name" required placeholder="如 666api"></div>
        <div class="field"><label>网站地址（Base URL）</label><input id="p_url" placeholder="https://example.com/v1"></div>
        <div class="field"><label>协议</label><select id="p_protocol">
          <option value="openai">OpenAI 兼容</option><option value="anthropic">Anthropic</option>
          <option value="gemini">Gemini</option><option value="custom">自定义 HTTP</option></select></div>
        <div class="field"><label>API Key（可选）</label><input id="p_key" type="password" placeholder="添加后默认隐藏"></div>
        <button class="btn primary">登记中转站</button>
      </form>
    </div>
    ${state.providers.length ? `<table><tr><th>名称</th><th>网站</th><th>协议</th><th>模型</th><th>密钥</th><th>状态</th><th>操作</th></tr>${rows}</table>` : '<div class="card empty">还没有登记中转站</div>'}`;
}
async function createProvider(e) {
  e.preventDefault();
  try {
    await api("/providers", { method: "POST", body: JSON.stringify({
      name: $("#p_name").value.trim(), base_url: $("#p_url").value.trim(),
      protocol: $("#p_protocol").value, api_key: $("#p_key").value.trim(),
    })});
    toast("已登记"); render();
  } catch (err) { toast(err.message); }
  return false;
}
window.createProvider = createProvider;
async function toggleProvider(id, enabled) {
  try { await api(`/providers/${id}`, { method: "PUT", body: JSON.stringify({ enabled }) }); render(); } catch (err) { toast(err.message); }
}
window.toggleProvider = toggleProvider;
async function delProvider(id) {
  if (!confirm("删除该中转站将同时删除其下的模型与密钥记录，确定？")) return;
  try { await api(`/providers/${id}`, { method: "DELETE" }); toast("已删除"); render(); } catch (err) { toast(err.message); }
}
window.delProvider = delProvider;
function editProvider(id) {
  const p = state.providers.find(x => x.id === id);
  openModal(`<h3>编辑中转站 · ${esc(p.name)}</h3>
    <div class="field" style="margin-bottom:10px"><label>名称</label><input id="ep_name" value="${esc(p.name)}" style="width:100%"></div>
    <div class="field" style="margin-bottom:10px"><label>网站地址（Base URL）</label><input id="ep_url" value="${esc(p.base_url)}" style="width:100%"></div>
    <div class="field" style="margin-bottom:10px"><label>协议</label><select id="ep_protocol" style="width:100%">
      <option value="openai" ${p.protocol === "openai" ? "selected" : ""}>OpenAI 兼容</option>
      <option value="anthropic" ${p.protocol === "anthropic" ? "selected" : ""}>Anthropic</option>
      <option value="gemini" ${p.protocol === "gemini" ? "selected" : ""}>Gemini</option>
      <option value="custom" ${p.protocol === "custom" ? "selected" : ""}>自定义 HTTP</option></select></div>
    <div class="hint">修改 Key 请用「添加 Key」新增（旧 Key 可在查看弹窗中管理），已保存的 Key 不会明文回显。</div>
    <div class="foot"><button class="btn" onclick="closeModal()">取消</button>
    <button class="btn primary" onclick="saveProvider(${id})">保存修改</button></div>`);
}
window.editProvider = editProvider;
async function saveProvider(id) {
  try {
    await api(`/providers/${id}`, { method: "PUT", body: JSON.stringify({
      name: $("#ep_name").value.trim(), base_url: $("#ep_url").value.trim(), protocol: $("#ep_protocol").value }) });
    closeModal(); toast("已保存修改"); render();
  } catch (err) { toast(err.message); }
}
window.saveProvider = saveProvider;
async function manageKeys(pid) {
  const p = state.providers.find(x => x.id === pid);
  if (!p) return;
  const creds = await api(`/providers/${pid}/credentials`);
  window._creds = creds;
  const rows = creds.map(c => `<tr><td>${esc(c.label)}</td><td class="code">${esc(c.key_hint)}</td>
    <td class="actions"><button class="btn small" onclick="revealOneKey(${c.id})">查看</button><button class="btn small danger" onclick="delKey(${pid}, ${c.id})">删除</button></td></tr>`).join("");
  openModal(`<h3>API Key 管理 · ${esc(p.name)}</h3>

async function selectScriptProject() {

async function renderScriptPanel(projId) {

        <td>${(s.size / 1024).toFixed(1)} KB</td>

        <td class="actions"><button class="btn small" data-name="${esc(s.name)}" ${s.runnable ? "" : "disabled"} onclick="runOneScript(${projId}, this)">运行</button></td>

async function runAllScripts(projId) {

}
window.runAllScripts = runAllScripts;

async function runOneScript(projId, btn) {

async function runScriptCommand(projId) {

function beginJob(jobId) {
  execJobId = jobId;

function execSelectAll() {
  document.querySelectorAll(".exec-check:not(:disabled)").forEach(c => { c.checked = true; });

function execSelected() {
  return [...document.querySelectorAll(".exec-check:checked")].map(c => +c.value);
}

async function doPreview() {
  const ids = execSelected();
  if (!ids.length) { toast("请先勾选测试项目"); return; }
  try {
    const r = await api("/preview", { method: "POST", body: JSON.stringify({ project_ids: ids }) });

         <div class="mono" style="margin-top:8px">${esc(JSON.stringify(p.body, null, 2))}</div>`).join("<hr>");

async function startExec(skipConfirm) {
  const ids = execSelected();
  if (!ids.length) { toast("请先勾选测试项目"); return; }
  if (!skipConfirm && !confirm("将向中转站发送真实付费请求（费用按各中转站计费），确认执行？")) return;
  try {
    const r = await api("/execute", { method: "POST", body: JSON.stringify({ project_ids: ids, confirmed: true }) });
    beginJob(r.job_id);
  } catch (err) { toast(err.message); }
}
window.startExec = startExec;

async function pollJob() {
  if (!execJobId) return;
  try {
    const j = await api(`/jobs/${execJobId}`);
    $("#term").innerHTML = j.lines.map(l =>
      `<span class="dim">[${l.ts}]</span> <span class="${l.kind}">${esc(l.text)}</span>`).join("\n");
    $("#term").scrollTop = $("#term").scrollHeight;
    $("#term-status").textContent = ({running: "运行中", finished: "已完成", cancelled: "已取消", error: "异常"})[j.status] || j.status;
    if (j.status === "running") {
      execPollTimer = setTimeout(pollJob, 800);
      $("#term-cancel").disabled = false;
    } else {
      $("#term-cancel").disabled = true;
      renderResults(j.runs);
      refreshData().then(() => { if (state.tab === "exec") renderExecHistOnly(); });
      toast(`任务${j.status === "finished" ? "完成" : j.status}`);
    }
  } catch (err) { toast(err.message); }
}
window.pollJob = pollJob;

function renderResults(runs) {
  if (!runs || !runs.length) { $("#exec-results").innerHTML = ""; return; }
  const rows = runs.map(r => `
    <tr>
      <td><b>${esc(r.project_name)}</b></td>
      <td>${esc(r.model_name)}</td>
      <td>${r.http_status || "—"}</td>
      <td class="${r.status === "passed" ? "pass" : "fail"}">${r.status === "passed" ? "通过" : r.status === "failed" ? "失败" : r.status}</td>
      <td>${esc(r.verdict)}</td>
      <td>${r.duration_ms}ms${r.ttft_ms ? ` / 首Token ${r.ttft_ms}ms` : ""}</td>

    <table><tr><th>项目</th><th>模型</th><th>HTTP</th><th>判定</th><th>说明</th><th>耗时/TTFT</th><th>证据</th></tr>${rows}</table></div>`;
}

async function renderExecHistOnly() {

  const hist = $("#main");
  renderExec();
}

async function cancelJob() {
  if (!execJobId) return;
  try { await api(`/jobs/${execJobId}/cancel`, { method: "POST" }); toast("已发送取消信号"); } catch (err) { toast(err.message); }
}
window.cancelJob = cancelJob;

async function viewRun(id) {
  try {
    const r = await api(`/runs/${id}`);
    const files = Object.keys(r.evidence || {});
    const tabs = files.length
      ? `<div class="ev-tabs" id="ev-tabs">${files.map((f, i) => `<button class="${i === 0 ? "on" : ""}" onclick="evTab('${f}')">${f}</button>`).join("")}</div><div class="mono" id="ev-body"></div>`
      : '<div class="hint">证据目录为空（可能是执行前被取消）</div>';
    const original = r.summary?.asset_id ? `<a class="btn small" href="${API}/assets/${encodeURIComponent(r.summary.asset_id)}/download" target="_blank" rel="noopener">原始文件</a>` : "";
    openModal(`<h3>运行 #${r.id} 证据 <span class="tag">${esc(r.project_name)}</span> <span class="tag ${r.status === "passed" ? "" : "off"}">${r.status}</span></h3>
      <div class="hint">${esc(r.verdict)} · 耗时 ${r.duration_ms}ms${r.ttft_ms ? ` · 首Token ${r.ttft_ms}ms` : ""} · 证据目录 <span class="code">${esc(r.evidence_dir)}</span></div>
      ${tabs}
      <div class="foot">${original}<button class="btn" onclick="closeModal()">关闭</button></div>`);
    window._ev = r.evidence;
    if (files.length) evTab(files[0]);
  } catch (err) { toast(err.message); }
}

function evTab(name) {
  document.querySelectorAll("#ev-tabs button").forEach(b => b.classList.toggle("on", b.textContent === name));
  const raw = window._ev[name];
  let text = Array.isArray(raw) ? raw.join("\n") : raw;
  try { text = JSON.stringify(JSON.parse(text), null, 2); } catch (e) {}
  $("#ev-body").textContent = text || "（空）";
}
window.evTab = evTab;


/* ---------------- 模型对比 ---------------- */
const MX_CAT_CN = { chat: "对话", stream: "流式", json: "JSON", tools: "工具" };
const MX_ST_CN = { compatible: "兼容", partial: "部分", unsupported: "不支持", unknown: "未知", untested: "未测试", manual_review: "待复核" };
const MX_ST_CLS = { compatible: "ok", partial: "warn", unsupported: "off", unknown: "gray", untested: "gray", manual_review: "" };

async function renderMatrix() {
  const m = await api("/matrix");
  if(state.tab!=='matrix') return;
  state.matrix = m;
  const cats = m.categories, s = m.summary;
  const stats = `
    <div class="stat"><div class="num" style="color:var(--ok)">${s.compatible}</div><div class="label">兼容</div></div>
    <div class="stat"><div class="num" style="color:var(--warn)">${s.partial}</div><div class="label">部分支持</div></div>
    <div class="stat"><div class="num" style="color:var(--danger)">${s.unsupported}</div><div class="label">不支持</div></div>
    <div class="stat"><div class="num">${s.unknown}</div><div class="label">未知</div></div>
    <div class="stat"><div class="num" style="color:var(--text-3)">${s.untested}</div><div class="label">未测试</div></div>
    <div class="stat"><div class="num" style="color:var(--accent)">${s.manual_review}</div><div class="label">待复核</div></div>`;
  const head = cats.map(c => `<th>${esc(MX_CAT_CN[c] || c)}</th>`).join("");
  const rows = m.rows.map((row, i) => `
    <tr>
      <td><b>${esc(row.model_name)}</b></td>
      <td>${esc(row.provider_name)}</td>
      ${cats.map((c, j) => {
        const cell = row.cells[c] || { effective_status: "untested", basis: "未测试" };
        const st = cell.effective_status || "untested";
        const manual = (cell.override_status || cell.note) ? " ✎" : "";
        const tip = [cell.basis, cell.note ? "备注：" + cell.note : ""].filter(Boolean).join("；");
        return `<td><span class="tag ${MX_ST_CLS[st] || "gray"}" style="cursor:pointer" title="${esc(tip)}" onclick="cellDetail(${i},${j})">${MX_ST_CN[st] || st}${manual}</span></td>`;
      }).join("")}
    </tr>`).join("");
  $("#main").innerHTML = `
    <h2>模型对比</h2>
    <div class="hint">同一模型的多行相邻排列，即<b>跨中转站对比</b>——同一模型在不同中转站的能力差异一目了然。结论由运行记录自动聚合：兼容 = 全部通过；部分 = 有通过有失败；不支持 = 全部假成功（HTTP 200 但功能未生效）；未知 = 失败但属鉴权/限流/服务端错误。<b>✎</b> 表示已有人工复核。点击色块查看明细、复核与备注。</div>
    <div class="grid">${stats}</div>
    ${m.rows.length ? `<table><tr><th>模型</th><th>中转站</th>${head}</tr>${rows}</table>` : '<div class="card empty">还没有可展示的数据——先到「执行测试」跑一轮，或在「中转站」「模型」完成登记</div>'}
    <div class="hint" style="margin-top:10px">图例：<span class="tag ok">兼容</span> <span class="tag warn">部分</span> <span class="tag off">不支持</span> <span class="tag gray">未知 / 未测试</span> <span class="tag">待复核</span></div>`;
}
window.renderMatrix = renderMatrix;

async function cellDetail(i, j) {
  const m = state.matrix;
  const row = m.rows[i], cat = m.categories[j];
  if (!row) return;
  let d;
  try { d = await api(`/matrix/detail?provider_id=${row.provider_id}&model_name=${encodeURIComponent(row.model_name)}&category=${encodeURIComponent(cat)}`); }

  window._mx = { row, cat };
  const runRows = d.runs.map(r => `
    <tr>
      <td class="code">${esc(r.started_at)}</td>
      <td>${esc(r.project_name)}</td>

      <td class="${r.status === "passed" ? "pass" : r.status === "failed" ? "fail" : ""}">${r.status === "passed" ? "通过" : r.status === "failed" ? "失败" : "导入记录"}</td>
      <td>${esc(r.verdict).slice(0, 50)}</td>
      <td>${r.duration_ms}ms${r.ttft_ms ? ` / ${r.ttft_ms}ms` : ""}</td>
      <td><button class="btn small" onclick="viewRun(${r.id})">证据</button></td>
    </tr>`).join("");
  const review = d.review || {};
  openModal(`<h3>${esc(row.model_name)} · ${esc(row.provider_name)} · ${esc(MX_CAT_CN[cat] || cat)}</h3>
    <div class="hint">该组合共 ${d.runs.length} 次执行记录。原始证据只读，人工复核不会改变运行记录。</div>
    <div style="max-height:38vh;overflow:auto">
    ${d.runs.length ? `<table><tr><th>时间</th><th>项目</th><th>HTTP</th><th>结果</th><th>判定</th><th>耗时/TTFT</th><th>证据</th></tr>${runRows}</table>` : '<div class="empty">该分类还没有执行记录</div>'}
    </div>
    <h3 style="margin-top:16px">人工复核</h3>
    <div class="field" style="margin-bottom:10px"><label>复核结论（覆盖自动聚合，留空 = 跟随自动结论）</label>
      <select id="mx_status">
        <option value="">（自动聚合）</option>
        <option value="compatible">兼容</option>
        <option value="partial">部分支持</option>
        <option value="unsupported">不支持</option>
        <option value="unknown">未知</option>
        <option value="manual_review">待复核</option>
      </select></div>
    <div class="field"><label>备注</label><textarea id="mx_note" placeholder="记录例外情况、复测计划、个例级差异等">${esc(review.note || "")}</textarea></div>
    <div class="foot"><button class="btn" onclick="mxReview(false)">清除复核</button>
    <button class="btn" onclick="closeModal()">关闭</button>
    <button class="btn primary" onclick="mxReview(true)">保存复核</button></div>`);
  if (review.override_status) $("#mx_status").value = review.override_status;
}
window.cellDetail = cellDetail;

window.mxReview = mxReview;

async function uploadTestRecord(e) {
  e.preventDefault();
  const file = $("#recordFile").files[0];
  if (!file) { toast("请选择 HTML 或表格文件"); return false; }
  const params = new URLSearchParams({
    filename: file.name,
    provider: $("#recordProvider").value.trim(),
    model: $("#recordModel").value.trim(),
    category: $("#recordCategory").value.trim(),
  });
  try {
    const response = await fetch(`${API}/import/upload?${params}`, {
      method: "POST",
      headers: { "Content-Type": file.type || "application/octet-stream" },
      body: file,
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || response.statusText);
    const r = data.recognized;
    toast(data.duplicate ? "相同文件和对比条件已存在，未重复存储" : `已归档并识别 ${r.rows} 行，正在打开模型对比`);
    state.tab = "matrix"; history.replaceState(null, "", "#matrix"); renderNav(); await render();
  } catch (err) { toast(err.message); }
  return false;
}
window.uploadTestRecord = uploadTestRecord;

        <button class="btn primary">上传并识别</button>
      </form>
      <div class="hint" style="margin:12px 0 0">支持 HTML 报告、CSV / TSV、Excel（XLSX）和 JSON。文件会上传到服务器，按内容哈希去重，并将识别结果加入「模型对比」。</div>
    </div>
    <div class="hint">扫描服务器已有资料目录（<span class="code">${esc(scan.root)}</span>）并登记为测试项目。原目录文件不移动、不修改。</div>
    <div class="card">
      <form class="row" onsubmit="return doImport(event)">
        <div class="field" style="flex:1;min-width:0"><label>旧资料根目录</label><input id="i_root" style="width:100%;min-width:0" value="${esc(scan.root)}"></div>
        <button class="btn" type="button" onclick="openFolderPicker()">浏览…</button>
        <button class="btn" type="button" onclick="renderImport()">重新扫描</button>
        <button class="btn primary">导入勾选项</button>
      </form>
    </div>
    ${scan.items.length ? `<table><tr><th>名称</th><th>类型</th><th>文件数</th><th>大小</th><th>建议分类</th><th>操作</th></tr>${rows}</table>` : '<div class="card empty">未扫描到可导入内容</div>'}`;
}
window.renderImport = renderImport;
async function viewItemFiles(i) {
  const it = window._scanItems[i];
  if (!it) return;
  let d;
  try { d = await api("/import/item-files", { method: "POST", body: JSON.stringify({ root: state.legacyRoot, name: it.name }) }); }
  catch (err) { toast(err.message); return; }
  window._itemFiles = d.files;
  window._itemRoot = state.legacyRoot;
  const kinds = {};
  d.files.forEach(f => kinds[f.kind] = (kinds[f.kind] || 0) + 1);
  const summary = Object.entries(kinds).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k}×${v}`).join(" · ");
  const rows = d.files.map((f, j) => `<tr><td class="code">${esc(f.rel_path)}</td><td><span class="tag gray">${f.kind}</span></td><td>${(f.size_bytes/1024).toFixed(1)} KB</td>
    <td class="actions"><button class="btn small" onclick="previewItemFile(${j})">预览</button><button class="btn small" onclick="openItemFile(${j})">打开</button></td></tr>`).join("");
  openModal(`<h3>内容构成 · ${esc(it.name)}</h3>
    <div class="hint" style="margin-bottom:10px">共 ${d.total} 个文件：${esc(summary)}${d.truncated ? "（仅列出前 2000 个）" : ""}。原文件只读，不移动、不复制、不修改。</div>
    <div style="max-height:55vh;overflow:auto"><table><tr><th>路径</th><th>类型</th><th>大小</th><th>操作</th></tr>${rows || '<tr><td colspan=4 class="empty">无</td></tr>'}</table></div>
    <div class="foot"><button class="btn" onclick="closeModal()">关闭</button></div>`);
}
window.viewItemFiles = viewItemFiles;
async function previewItemFile(j) {
  const f = window._itemFiles[j];
  if (!f) return;
  let d;
  try { d = await api(`/files/preview?path=${encodeURIComponent(f.rel_path)}&root=${encodeURIComponent(window._itemRoot || "")}`); }
  catch (err) { toast(err.message); return; }
  d.download_url = `${API}/files/download?path=${encodeURIComponent(f.rel_path)}&root=${encodeURIComponent(window._itemRoot || "")}`;
  showPreviewModal(d);
}
window.previewItemFile = previewItemFile;
async function openItemFile(j) {
  const f = window._itemFiles[j];
  if (!f) return;
  window.open(`${API}/files/download?path=${encodeURIComponent(f.rel_path)}&root=${encodeURIComponent(window._itemRoot || "")}`, "_blank", "noopener");
}
window.openItemFile = openItemFile;
function showPreviewModal(d) {
  let body;
  if (d.kind === "text") {
    body = `<pre id="previewContent" class="fileview preview-text">${esc(d.content)}</pre>` +
      (d.truncated ? '<div class="hint" style="margin-top:6px;flex:none">文件较大，仅显示前 200KB，完整内容请下载。</div>' : "");
  } else if (d.kind === "html") {
    body = `<div class="preview-content"><iframe id="previewFrame" title="HTML 测试报告预览" sandbox="" referrerpolicy="no-referrer"></iframe></div>`;
  } else if (d.kind === "image") {
    body = `<img src="${d.data}" alt="预览" style="max-width:100%;border:1px solid var(--border);border-radius:8px">`;
  } else {
    body = `<div class="hint">二进制文件（${(d.size/1024).toFixed(1)} KB），无法在线预览，请下载后用对应软件查看。</div>`;
  }
  openModal(`<h3 class="code" style="font-size:15px">${esc(d.name)}</h3>
    <div class="preview-toolbar"><label for="previewFont">字体</label><input id="previewFont" type="range" min="10" max="28" value="14" oninput="setPreviewFont(this.value)"><output id="previewFontValue">14px</output><button class="btn small" type="button" onclick="togglePreviewMax()" title="最大化预览" aria-label="最大化预览"><i data-lucide="maximize-2" aria-hidden="true"></i></button><button class="btn small" type="button" onclick="downloadPreviewFile()" title="下载原文件" aria-label="下载原文件"><i data-lucide="download" aria-hidden="true"></i></button></div>${body}
    <div class="foot"><button class="btn" onclick="closeModal()">关闭</button></div>`);
  $("#modalBox").classList.add("preview-modal");
  window._previewData = d;
  window.lucide?.createIcons({attrs:{"stroke-width":1.65,"aria-hidden":"true"}});
  setPreviewFont(14);
}
window.showPreviewModal = showPreviewModal;
function previewDocument(html, size) {
  const policy = `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; base-uri 'none'; form-action 'none'">`;
  const safe = String(html || "").replace(/<script\b[\s\S]*?<\/script\s*>/gi, "").replace(/<iframe\b[\s\S]*?<\/iframe\s*>/gi, "");
  const style = `<style>html{font-size:${size}px !important}body{font-size:1em !important;line-height:1.6 !important;overflow-wrap:anywhere}</style>`;
  return safe.replace(/<head([^>]*)>/i, `<head$1>${policy}${style}`) || `${policy}${style}${safe}`;
}
function setPreviewFont(size) {
  const value = Math.max(10, Math.min(28, Number(size) || 14));
  if ($("#previewFontValue")) $("#previewFontValue").textContent = `${value}px`;
  const frame = $("#previewFrame");
  if (frame) {
    frame.srcdoc = previewDocument(window._previewData?.content || "", value);
  } else {
    const text = $("#previewContent");
    if (!text) return;
    text.style.fontSize = `${value}px`;
  }
}
window.setPreviewFont = setPreviewFont;
function togglePreviewMax() { $("#modalBox").classList.toggle("is-max"); }
function downloadPreviewFile() {
  const d = window._previewData;
  if (d?.download_url) window.open(d.download_url, "_blank", "noopener");
  else toast("当前文件来自旧资料目录，请在内容列表中点下载");
}
async function doImport(e) {
  e.preventDefault();
  const folders = [...document.querySelectorAll(".imp-check:checked")].map(c => c.value);
  if (!folders.length) { toast("请先勾选要导入的目录"); return false; }
  try {
    const r = await api("/import/execute", { method: "POST", body: JSON.stringify({ root: $("#i_root").value, folders }) });
    toast(`已导入 ${r.created.length} 个项目，登记 ${r.assets_added} 个文件`); render();
  } catch (err) { toast(err.message); }
  return false;
}
window.doImport = doImport;

/* 文件夹选择器：浏览本机目录，选择后回填到指定输入框 */
let pickerPath = "";
window._pickerTarget = null;  // 非空时回填到该 input id（否则回填导入根目录）
function openFolderPicker() {
  window._pickerTarget = null;
  pickerPath = ($("#i_root") ? $("#i_root").value.trim() : "");
  renderPicker();
}
function openFolderPickerFor(inputId) {
  window._pickerTarget = inputId;
  const el = document.getElementById(inputId);
  pickerPath = el ? el.value.trim() : "";
  renderPicker();
}
window.openFolderPicker = openFolderPicker;
window.openFolderPickerFor = openFolderPickerFor;
async function renderPicker() {
  try {
    const p = await api(`/fs/browse?path=${encodeURIComponent(pickerPath)}`);
    pickerPath = p.path;
    window._pkDirs = p.dirs;
    window._pkParent = p.parent;
    const rows = (p.parent ? `<tr><td><button class="btn small" onclick="pickerGo(window._pkParent)">↩ 上级目录</button></td></tr>` : "") +
      p.dirs.map((d, i) => `<tr><td><button class="btn small" onclick="pickerEnter(${i})">📁 ${esc(d)}</button></td></tr>`).join("");
    openModal(`<h3>选择文件夹</h3>
      <div class="code" style="margin-bottom:10px">${esc(p.path)}</div>
      <div style="max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:8px">
      <table><tr><th>子目录（点击进入）</th></tr>${rows || '<tr><td class="empty">无子目录</td></tr>'}</table></div>
      <div class="foot"><button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="pickerSelect()">选择当前目录</button></div>`);
  } catch (err) { toast(err.message); }
}
async function pickerGo(path) { pickerPath = path; await renderPicker(); }
function pickerEnter(i) { pickerGo(pickerPath.replace(/\/$/, "") + "/" + window._pkDirs[i]); }
function pickerSelect() {
  if (window._pickerTarget) {
    const input = document.getElementById(window._pickerTarget);
    if (input) input.value = pickerPath;
    window._pickerTarget = null;
    closeModal();
    return;
  }
  const input = $("#i_root");
  if (input) input.value = pickerPath;
  closeModal(); toast("已选择目录，正在重新扫描…"); renderImport();
}
window.pickerGo = pickerGo;
window.pickerEnter = pickerEnter;
window.pickerSelect = pickerSelect;

/* ---------------- 设置 ---------------- */
function renderSettings() {
  const set = state.stats.password_set;
  $("#main").innerHTML = `
    <h2>设置</h2>
    <div class="card">
      <h2 style="margin-top:0">平台主密码</h2>
      <div class="hint">主密码用于验证后临时查看 API Key 明文。${set ? "已设置，可直接修改。" : "尚未设置——不设置则无法查看任何 Key 明文。"}</div>
      <form class="row" onsubmit="return setPassword(event)">
        <div class="field"><label>${set ? "新密码" : "设置密码"}（至少 6 位）</label><input id="s_pw1" type="password" required minlength="6"></div>
        <div class="field"><label>再次输入</label><input id="s_pw2" type="password" required minlength="6"></div>
        <button class="btn primary">保存</button>
      </form>
    </div>
    <div class="card">
      <h2 style="margin-top:0">数据与执行</h2>
      <div class="hint">
        · API Key 使用 Fernet 加密存储，列表只显示掩码<br>
        · 查看明文需主密码重新认证<br>
        · 导入功能只读，不移动不修改旧文件<br>
        · 实际测试需预览并确认执行
      </div>
    </div>`;
}
async function setPassword(e) {
  e.preventDefault();
  if ($("#s_pw1").value !== $("#s_pw2").value) { toast("两次输入不一致"); return false; }
  try {
    await api("/security/set-password", { method: "POST", body: JSON.stringify({ password: $("#s_pw1").value }) });
    toast("主密码已保存"); render();
  } catch (err) { toast(err.message); }
  return false;
}
window.setPassword = setPassword;

renderNav();
render();

// 表格自适应：窗口变窄时表格整体横向滚动，而不是挤压换行错位
function wrapTables() {
  document.querySelectorAll("table:not(.wrapped)").forEach(t => {
    if (!t.parentNode) return;
    if (t.parentNode.classList && t.parentNode.classList.contains("tw")) { t.classList.add("wrapped"); return; }
    const d = document.createElement("div");
    d.className = "tw";
    t.parentNode.insertBefore(d, t);
    d.appendChild(t);
    t.classList.add("wrapped");
  });
}
window.wrapTables = wrapTables;
new MutationObserver(() => wrapTables()).observe(document.body, { childList: true, subtree: true });
</script>
</body>
